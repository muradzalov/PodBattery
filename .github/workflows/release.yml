# Push a tag like v0.1.0 to test, build a self-contained PodBattery.exe (needs no .NET on the target PC)
# and publish it, with its SHA-256, as a GitHub release. get.ps1 installs the latest one.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test -c Release

      - name: Build PodBattery.exe
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet publish src/PodBattery/PodBattery.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none -p:Version=$version -o out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash out/PodBattery.exe -Algorithm SHA256).Hash
          "$hash  PodBattery.exe" | Set-Content out/PodBattery.exe.sha256 -Encoding ascii
          "HASH=$hash" | Add-Content $env:GITHUB_ENV

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Install or update on any Windows 10/11 PC (x64), from PowerShell:

          ``````powershell
          irm https://raw.githubusercontent.com/${{ github.repository }}/main/get.ps1 | iex
          ``````

          Or download ``PodBattery.exe`` below and run it. It needs nothing else installed.

          SHA-256 of PodBattery.exe: ``$env:HASH``
          "@
          gh release create $env:TAG out/PodBattery.exe out/PodBattery.exe.sha256 `
            --title "PodBattery $env:TAG" --notes $notes --generate-notes
